; ESP32-WROOM-32E on the 4-channel BT137S thyristor switch board.
;
; Upload button / `pio run -t upload` → UART (esptool) via Serial Burn header.
; `pio run` (build only) → after firmware.bin, scripts/ota_after_build.py calls
; the monorepo fleet tool for ArduinoOTA when MQTT has a fresh device IP.
; Do not set upload_protocol=espota here — a placeholder IP (127.0.0.1) breaks
; the IDE Upload action after a soft OTA skip.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
upload_protocol = esptool
lib_deps =
    knolleary/PubSubClient@^2.8
extra_scripts =
    post:scripts/ota_after_build.py
