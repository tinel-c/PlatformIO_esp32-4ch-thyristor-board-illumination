; ESP32-WROOM-32E on the 4-channel BT137S thyristor switch board.
; First flash: Serial Burn header. Later updates: ArduinoOTA (espota) after build
; when the monorepo fleet tool has a fresh IP in device_fleet_state.json.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 460800
; Default upload is ArduinoOTA. First wired flash:
;   pio run -e esp32dev -t upload --upload-protocol esptool --upload-port COMx
; Later updates: `pio run` builds, then scripts/ota_after_build.py calls the
; monorepo fleet tool with the IP from MQTT status memory.
upload_protocol = espota
upload_port = 127.0.0.1
lib_deps =
    knolleary/PubSubClient@^2.8
extra_scripts =
    post:scripts/ota_after_build.py
